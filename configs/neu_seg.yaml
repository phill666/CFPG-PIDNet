dataset:
  name: NEU_Seg
  root: ./data/NEU_Seg
  image_dir: images\training
  mask_dir: annotations\training
  num_classes: 2
  split_dir: ./splits
  train_split: neu_seg_train.txt
  val_split: neu_seg_val.txt
  test_split: neu_seg_test.txt
  rebuild_split: false
  seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
train:
  input_size: 512
  epochs: 160
  batch_size: 16
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  power: 0.9
  amp: true
  seed: 42
variant: cfpg
loss:
  ce_weight: 1.0
  dice_weight: 1.0
